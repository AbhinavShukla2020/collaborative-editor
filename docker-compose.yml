services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: editor
      POSTGRES_PASSWORD: editor
      POSTGRES_DB: editor
    volumes: ["editor-db:/var/lib/postgresql/data"]
  server:
    build: ./server
    ports: ["1234:1234"]
    depends_on: [postgres]
    environment:
      DATABASE_URL: postgres://editor:editor@postgres:5432/editor
      PORT: "1234"
      SNAPSHOT_EVERY_UPDATES: "100"
  web:
    build: ./web
    ports: ["5173:80"]
    depends_on: [server]
volumes:
  editor-db:

